name: Diagnose SSH

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose.yml'
  workflow_dispatch:

concurrency:
  group: diagnose-production
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose SSH access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Diagnose
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set +e
          OUT=""

          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          OUT+="=== Secrets ===\n"
          OUT+="VPS_HOST=$VPS_HOST\n"
          OUT+="VPS_USER=$VPS_USER\n"
          OUT+="VPS_PORT=$VPS_PORT\n"
          OUT+="VPS_SSH_KEY length: ${#VPS_SSH_KEY}\n"
          OUT+="=== Secret key fingerprint + public key ===\n"
          OUT+="$(ssh-keygen -lf ~/.ssh/deploy_key 2>&1)\n"
          OUT+="$(ssh-keygen -y -f ~/.ssh/deploy_key 2>&1)\n"

          OUT+="=== SSH attempt ===\n"
          OUT+="$(ssh -v -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=15 -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" 'echo SSH_OK; hostname' 2>&1 | tail -30)\n"

          OUT+="=== Server-side inspection ===\n"
          OUT+="$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=15 -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" 'bash -s' << 'REMOTE' 2>&1
          echo "--- hostname ---"
          hostname
          echo "--- public IP ---"
          (curl -s --max-time 5 ifconfig.me || true); echo
          echo "--- sshd auth config ---"
          grep -RihE "^(PubkeyAuthentication|PasswordAuthentication|PermitRootLogin|AuthorizedKeysFile|Port)" /etc/ssh/sshd_config /etc/ssh/sshd_config.d/ 2>/dev/null
          echo "--- /root/.ssh ---"
          ls -la /root/.ssh/ 2>&1
          echo "--- authorized_keys ---"
          cat /root/.ssh/authorized_keys 2>&1
          echo "--- fail2ban sshd ---"
          (fail2ban-client status sshd 2>&1 || true)
          echo "--- ufw ---"
          (ufw status 2>&1 || true)
          REMOTE
          )\n"

          printf '%s' "$OUT" > ssh-diagnose.txt
          echo "$OUT"

      - name: Publish diagnostics to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:diagnostics/ssh --force
