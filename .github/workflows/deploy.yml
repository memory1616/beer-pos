name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      message:
        description: 'Deployment message'
        required: false
        default: 'Manual deploy via workflow_dispatch'

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server.js
            database.js
            database/
            views/
            public/
            routes/
            middleware/
            src/
            package.json
            package-lock.json
            ecosystem.config.js
            deploy/
            scripts/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js (for syntax check)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          check-latest: true

      - name: Pre-flight syntax check
        run: |
          echo "=== Syntax checking Node files ==="
          ERRORS=0
          for js in server.js database.js database/migration.js; do
            if [ -f "$js" ]; then
              if ! node --check "$js" 2>/dev/null; then
                echo "SYNTAX ERROR: $js"
                ERRORS=$((ERRORS + 1))
              else
                echo "OK: $js"
              fi
            fi
          done
          for js in $(find routes middleware -name "*.js" 2>/dev/null); do
            if ! node --check "$js" 2>/dev/null; then
              echo "SYNTAX ERROR: $js"
              ERRORS=$((ERRORS + 1))
            fi
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo "Found $ERRORS syntax errors - aborting deploy"
            exit 1
          fi

      - name: Verify deploy script exists
        run: |
          if [ ! -f "deploy/deploy.sh" ]; then
            echo "ERROR: deploy/deploy.sh not found"
            exit 1
          fi
          echo "Deploy script OK: $(wc -l < deploy/deploy.sh) lines"

      - name: Deploy to server via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          # Write SSH key to a temp file with correct perms
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # SSH options: disable strict host key for first run, batch mode for no prompts
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes -p ${VPS_PORT:-22}"

          echo "=== Running deploy.sh on $VPS_HOST ==="
          ssh $SSH_OPTS "${VPS_USER}@${VPS_HOST}" << 'REMOTE_SCRIPT'
            set -e
            echo "================================================"
            echo "  GitHub Action triggered deploy"
            echo "  Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "================================================"
            chmod +x /root/beer-pos/deploy/deploy.sh
            bash /root/beer-pos/deploy/deploy.sh
            echo ""
            echo "=== Verification ==="
            cd /root/beer-pos
            echo "Server HEAD: $(git rev-parse HEAD 2>/dev/null || echo 'unknown')"
            git log --oneline -3 2>/dev/null || echo "(no git history)"
            echo ""
            echo "=== Health check ==="
            pm2 status beer-pos 2>&1 | head -10
            curl -fsS http://127.0.0.1:3000/health && echo "HEALTH OK" || echo "HEALTH FAILED"
          REMOTE_SCRIPT

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          echo "SSH key cleaned up"
