<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Trang chủ Tài xế — Bia Tươi Tây Ninh</title>
  <meta name="theme-color" content="#0B0E11">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Giao Hàng">
  <link rel="stylesheet" href="/css/driver.css?v=20261107m">
</head>
<body class="drv-home-body">

  <!-- ════ HEADER ════ -->
  <header class="drv-home-header">
    <div class="drv-home-header__brand">
      <div class="drv-home-header__logo" aria-hidden="true">🍺</div>
      <div class="drv-home-header__brandtext">
        <div class="drv-home-header__name">BIA TƯƠI TÂY NINH</div>
        <div class="drv-home-header__tag">CỔNG TÀI XẾ</div>
      </div>
    </div>

    <div class="drv-home-header__meta">
      <div class="drv-home-header__date" id="home-date">—</div>
      <div class="drv-home-header__status" id="home-status">
        <span class="drv-home-header__dot" aria-hidden="true"></span>
        <span id="home-status-text">Đang kiểm tra…</span>
      </div>
    </div>
  </header>

  <!-- ════ MAIN ════ -->
  <main class="drv-home-main">

    <!-- Tài xế đang đăng nhập -->
    <section class="drv-home-user">
      <div class="drv-home-user__avatar" aria-hidden="true">👤</div>
      <div class="drv-home-user__body">
        <div class="drv-home-user__label">Tài xế đang đăng nhập</div>
        <div class="drv-home-user__name" id="home-user-name">…</div>
        <div class="drv-home-user__username" id="home-user-username"></div>
      </div>
    </section>

    <!-- BỘ LỌC THỐNG KÊ THEO NGÀY TRONG THÁNG -->
    <section class="drv-home-filter">
      <div class="drv-home-filter__monthbar">
        <button class="drv-home-filter__nav" id="home-prev-month" type="button" aria-label="Tháng trước">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </button>
        <div class="drv-home-filter__month" id="home-month-label">Tháng —</div>
        <button class="drv-home-filter__nav" id="home-next-month" type="button" aria-label="Tháng sau">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </button>
      </div>

      <div class="drv-home-filter__days" id="home-day-list" role="tablist" aria-label="Chọn ngày trong tháng"></div>

      <div class="drv-home-filter__summary" id="home-month-summary">
        <span class="drv-home-filter__sumitem">
          <b id="home-sum-orders">0</b> đơn
        </span>
        <span class="drv-home-filter__sep" aria-hidden="true">·</span>
        <span class="drv-home-filter__sumitem">
          <b id="home-sum-liters">0</b> lít
        </span>
        <span class="drv-home-filter__sep" aria-hidden="true">·</span>
        <span class="drv-home-filter__sumitem">
          <b id="home-sum-kegs">0</b> vỏ
        </span>
        <span class="drv-home-filter__sumlabel">cả tháng</span>
      </div>
    </section>

    <!-- THỐNG KÊ — 3 KPI -->
    <section class="drv-home-stats-section">
      <h2 class="drv-home-section__title" id="home-stats-title">Thống kê hôm nay</h2>

      <div class="drv-home-stats">
        <div class="drv-home-kpi drv-home-kpi--orders">
          <span class="drv-home-kpi__icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m7.5 4.27 9 5.15"/>
              <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
              <path d="m3.3 7 8.7 5 8.7-5"/>
              <path d="M12 22V12"/>
            </svg>
          </span>
          <span class="drv-home-kpi__value" id="home-orders">0</span>
          <span class="drv-home-kpi__label">Số đơn</span>
        </div>

        <div class="drv-home-kpi drv-home-kpi--liters">
          <span class="drv-home-kpi__icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 2v2"/>
              <path d="M14 2v2"/>
              <path d="M16 2v2"/>
              <path d="M6 8h12v10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2Z"/>
              <path d="M6 8c0-2 1-3 2-3h8c1 0 2 1 2 3"/>
              <path d="M18 10h1a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-1"/>
            </svg>
          </span>
          <span class="drv-home-kpi__value" id="home-liters">0</span>
          <span class="drv-home-kpi__label">Số lít bia</span>
        </div>

        <div class="drv-home-kpi drv-home-kpi--kegs">
          <span class="drv-home-kpi__icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
              <path d="m3.3 7 8.7 5 8.7-5"/>
              <path d="M12 22V12"/>
            </svg>
          </span>
          <span class="drv-home-kpi__value" id="home-kegs">0</span>
          <span class="drv-home-kpi__label">Vỏ đã thu</span>
        </div>
      </div>
    </section>

    <!-- Trạng thái -->
    <div class="drv-home-hint" id="home-hint"></div>
  </main>

  <!-- ════ NAV ════ -->
  <nav class="drv-nav">
    <a class="drv-nav__item is-active" data-nav="home" href="/driver">
      <span class="drv-nav__icon">🏠</span><span>TRANG CHỦ</span>
    </a>
    <a class="drv-nav__item" data-nav="sale" href="/driver/ban-hang">
      <span class="drv-nav__icon">🛒</span><span>BÁN HÀNG</span>
    </a>
    <a class="drv-nav__item" data-nav="delivery" href="/driver/giao-hang">
      <span class="drv-nav__icon">🚚</span><span>GIAO HÀNG</span>
      <span class="drv-nav__badge" data-nav-badge style="display:none">0</span>
    </a>
    <a class="drv-nav__item" data-nav="logout" href="/auth/driver/logout"
       onclick="event.preventDefault(); window.Drv.logout();">
      <span class="drv-nav__icon">🚪</span><span>ĐĂNG XUẤT</span>
    </a>
  </nav>

  <script src="/js/driver/core.js?v=20261107k"></script>
  <script src="/js/driver/home.js?v=20261107k"></script>
</body>
</html>
