<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Giao hàng — Bia Tươi Tây Ninh</title>
  <meta name="theme-color" content="#0B0E11">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- ═══ DESIGN SYSTEM (dùng chung 3 trang) ═══ -->
  <link rel="stylesheet" href="/css/driver-system.css?v=20261112a">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="ds-app">

  <div id="app"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/map-tiles.js?v=20261108b"></script>
  <script src="/js/driver/core.js?v=20261112a"></script>
  <script src="/js/driver/shell.js?v=20261112a"></script>
  <!-- Đồng bộ real-time giữa trang Bán hàng ↔ Giao hàng -->
  <script src="/js/driver/sync.js?v=20261112a"></script>
  <script>
  /* ═══════════════════════════════════════════════════════════════════════
   * MODULE GIAO HÀNG — TÀI XẾ
   * ═══════════════════════════════════════════════════════════════════════
   * Dùng CHUNG Design System với Trang chủ & Bán hàng:
   *   • App bar + bottom nav do shell.js dựng (không tự vẽ header/nav)
   *   • Component: ds-card, ds-stat, ds-btn, ds-row, ds-field…
   *
   * Nghiệp vụ (không đổi):
   *   1. Dữ liệu từ /api/driver/delivery/page-data — đơn của chính tài xế
   *      + đơn Admin tạo chưa gán ai.
   *   2. Panel giao nội tuyến (không modal): số lượng giao, vỏ thu, ghi chú,
   *      4 nút hành động — dùng chung DeliveryService với Admin.
   *   3. Đồng bộ vỏ giao/thu với màn Bán hàng qua /api/driver/sales/:id/kegs.
   * ═══════════════════════════════════════════════════════════════════════ */
  (async function () {
    /* ── Bắt buộc đăng nhập tài xế ── */
    try {
      await window.Drv.requireAuth();
    } catch (_) { return; }

    var S = window.DrvShell;

    /* ── Dữ liệu (scope tài xế) ── */
    var data = { customers: [], settings: {} };
    try {
      data = await window.Drv.api.get('/api/driver/delivery/page-data');
    } catch (e) {
      console.error('[DELIVERY] load page-data error:', e);
    }

    var customers = data.customers || [];
    var settings = data.settings || {};

    /* Nhãn trạng thái tiếng Việt (fallback nếu API không trả) */
    var STATUS_LABELS = data.statusLabels || {
      PENDING: 'Chờ giao',
      IN_PROGRESS: 'Đang giao',
      DELIVERED: 'Đã giao',
      FAILED: 'Giao thất bại',
      DISCREPANCY: 'Chờ xử lý sai lệch'
    };

    /** Tra nhãn tiếng Việt của 1 trạng thái giao hàng */
    function statusLabel(key) {
      if (!key) return '';
      return STATUS_LABELS[key] || key;
    }
    /** Nhãn tiếng Việt của loại sự kiện trong lịch sử */
    var EVENT_LABELS = {
      CREATED: 'Tạo phiếu giao',
      STATUS_CHANGED: 'Đổi trạng thái',
      CONFIRMED: 'Xác nhận giao',
      DISCREPANCY: 'Báo sai lệch',
      KEGS_UPDATED: 'Cập nhật vỏ'
    };

    function eventLabel(key) {
      if (!key) return '';
      return EVENT_LABELS[key] || key;
    }

    /**
     * Mở hóa đơn của 1 đơn — GIỐNG HỆT nút "👁 Xem" ở tab ĐƠN GẦN ĐÂY
     * (trang Bán hàng).
     *
     * Cách làm: chuyển sang trang Bán hàng kèm `?invoice=<saleId>`.
     * Trang Bán hàng đọc tham số này và gọi đúng `openInvoiceModal()` —
     * nên hóa đơn render y hệt (cùng module sales.js dùng chung),
     * không viết lại logic hóa đơn ở đây.
     */
    function openInvoiceForSale(saleId) {
      var id = parseInt(saleId, 10);
      if (!Number.isFinite(id) || id <= 0) return;
      window.location.href = '/driver/ban-hang?invoice=' + id;
    }

    var lat = settings.distributor_lat || 11.3296;
    var lng = settings.distributor_lng || 106.1495;
    var curLat = null, curLng = null;
    var map = null, userMarker = null;

    /* ═══════════════════════════════════════════════════════════════════
     * Markup — dùng chung component của Design System
     * ═══════════════════════════════════════════════════════════════════ */
    function markup() {
      return '' +
        /* ── Bản đồ ── */
        '<section class="ds-section">' +
          '<div class="ds-map" id="map"></div>' +
        '</section>' +

        /* ── Chỉ số ── */
        '<section class="ds-section">' +
          '<div class="ds-stats">' +
            '<div class="ds-stat">' +
              '<span class="ds-stat__value" id="count">0</span>' +
              '<span class="ds-stat__label">Đơn hôm nay</span>' +
            '</div>' +
            '<div class="ds-stat ds-stat--ok">' +
              '<span class="ds-stat__value" id="km">-</span>' +
              '<span class="ds-stat__label">Tổng km</span>' +
            '</div>' +
          '</div>' +
        '</section>' +

        /* ── Hành động (vùng ngón cái) ── */
        '<section class="ds-section">' +
          '<div class="ds-btn-row">' +
            '<button class="ds-btn" onclick="getLocation()" type="button">📍 Vị trí</button>' +
            '<button class="ds-btn ds-btn--primary" onclick="optimize()" type="button">⚡ Tối ưu</button>' +
          '</div>' +
        '</section>' +

        /* ── Danh sách giao hàng ── */
        '<section class="ds-section">' +
          '<div class="ds-section__head">' +
            '<h2 class="ds-section__title">Danh sách giao hàng</h2>' +
            '<span class="ds-section__badge" id="dl-list-count">0</span>' +
          '</div>' +
          '<div class="ds-list" id="list"></div>' +
        '</section>';
    }

    function dist(lat1, lng2, lat2, lng3) {
      var R = 6371;
      var d = (lat2 - lat1) * Math.PI / 180;
      var e = (lng3 - lng2) * Math.PI / 180;
      var a = Math.sin(d / 2) * Math.sin(d / 2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(e / 2) * Math.sin(e / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function icon(color, size) {
      size = size || 12;
      return L.divIcon({
        className: 'm',
        html: '<div style="background:' + color + ';width:' + size + 'px;height:' + size +
              'px;border-radius:50%;border:2px solid #fff;"></div>',
        iconSize: [size, size],
        iconAnchor: [size / 2, size / 2]
      });
    }

    function formatVND(n) {
      return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    function esc(s) {
      return String(s === null || s === undefined ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#x27;');
    }

    /* ═══════════════════════════════════════════════════════════════════
     * Render danh sách khách
     * ═══════════════════════════════════════════════════════════════════ */
    function render() {
      var countEl = document.getElementById('count');
      if (countEl) countEl.textContent = customers.length;

      var badgeEl = document.getElementById('dl-list-count');
      if (badgeEl) badgeEl.textContent = customers.length;

      var totalKm = 0;
      var originLat = curLat || lat;
      var originLng = curLng || lng;
      var html = '';
      var countWithGPS = 0;

      customers.forEach(function (c) {
        var d = 0;
        if (c.lat && c.lng) {
          d = dist(originLat, originLng, parseFloat(c.lat), parseFloat(c.lng));
          totalKm += d;
          countWithGPS++;
        }
        var gpsIcon = c.lat && c.lng
          ? '<span style="color:#0ECB81">📍</span>'
          : '<span style="color:var(--ds-text-3)">📍</span>';
        var totalStr = c.total ? formatVND(c.total) + 'đ' : '';
        var st = c.delivery_status
          ? '<span class="ds-status ds-status--' + esc(c.delivery_status) + '">' +
            esc(statusLabel(c.delivery_status)) + '</span>'
          : '';

        html += '<article class="ds-delivery" data-customer-id="' + c.id + '">' +
          '<div class="ds-delivery__name">' + gpsIcon + ' ' + esc(c.name) + st + '</div>' +
          '<div class="ds-delivery__info">📞 ' + esc(c.phone || '-') +
            (totalStr ? ' · ' + totalStr : '') +
            (c.lat && c.lng ? ' · 📍 ' + d.toFixed(1) + ' km' : '') +
          '</div>' +
          '<div class="ds-delivery__actions">' +
            (c.lat && c.lng
              ? '<a href="https://www.google.com/maps/dir/?api=1&destination=' + c.lat + ',' + c.lng +
                '" target="_blank" rel="noopener" class="ds-btn--dir">' +
                  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
                  'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                  '<polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21 3 6"/>' +
                  '<line x1="9" x2="9" y1="3" y2="18"/><line x1="15" x2="15" y1="6" y2="21"/></svg>Chỉ đường</a>'
              : '<span class="ds-btn--dir is-disabled" title="Khách chưa có tọa độ GPS">' +
                  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
                  'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                  '<polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21 3 6"/>' +
                  '<line x1="9" x2="9" y1="3" y2="18"/><line x1="15" x2="15" y1="6" y2="21"/></svg>Chỉ đường</span>') +
            '<button class="ds-btn--deliver" data-act="open-delivery" type="button">' +
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
              'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
              '<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/>' +
              '<path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A2 2 0 0 0 17.52 8H14"/>' +
              '<circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>Giao hàng</button>' +
          '</div>' +
          '<div class="ds-delivery__panel"></div>' +
        '</article>';
      });

      var kmEl = document.getElementById('km');
      if (kmEl) kmEl.textContent = countWithGPS > 0 ? totalKm.toFixed(1) : '-';

      var list = document.getElementById('list');
      if (list) list.innerHTML = html || S.empty('📦', 'Chưa có đơn hàng');
    }

    /* ═══════════════════════════════════════════════════════════════════
     * Bản đồ
     * ═══════════════════════════════════════════════════════════════════ */
    function initMap() {
      if (typeof L === 'undefined') return;
      map = L.map('map').setView([lat, lng], 12);

      // Google Maps qua proxy của server (không cần API key, không bị chặn Referer)
      if (window.MapTiles && window.MapTiles.addTiles) {
        var tiles = window.MapTiles.addTiles(map, { layer: 'google' });
        window.MapTiles.addLayerSwitcher(map, null, { layer: 'google', tiles: tiles });
      } else {
        L.tileLayer('/map-tiles/{z}/{x}/{y}.jpg?layer=google', {
          attribution: '© Google Maps', maxZoom: 19
        }).addTo(map);
      }

      L.marker([lat, lng], { icon: icon('#0ECB81', 16) }).addTo(map).bindPopup('🏭 Kho');

      customers.forEach(function (c) {
        if (c.lat && c.lng) {
          L.marker([parseFloat(c.lat), parseFloat(c.lng)], { icon: icon('#3b82f6', 10) })
            .addTo(map).bindPopup(esc(c.name));
        }
      });
    }

    window.getLocation = function () {
      if (!navigator.geolocation) { window.Drv.toast('GPS không hỗ trợ', 'warning'); return; }
      navigator.geolocation.getCurrentPosition(function (p) {
        curLat = p.coords.latitude;
        curLng = p.coords.longitude;
        if (map) {
          map.setView([curLat, curLng], 14);
          if (userMarker) map.removeLayer(userMarker);
          userMarker = L.marker([curLat, curLng], { icon: icon('#F6465D', 14) })
            .addTo(map).bindPopup('📍 Bạn');
        }
        render();
        window.Drv.toast('Đã cập nhật vị trí!', 'success');
      }, function () {
        window.Drv.toast('Không lấy được vị trí GPS', 'error');
      }, { enableHighAccuracy: true, timeout: 10000 });
    };

    window.optimize = function () {
      var originLat = curLat || lat;
      var originLng = curLng || lng;
      customers.sort(function (a, b) {
        return dist(originLat, originLng, parseFloat(a.lat || 0), parseFloat(a.lng || 0)) -
               dist(originLat, originLng, parseFloat(b.lat || 0), parseFloat(b.lng || 0));
      });
      render();
      window.Drv.toast('Đã sắp xếp theo khoảng cách!', 'success');
    };

    window.showSettings = function () {
      window.Drv.toast('Chỉ Admin mới cấu hình được phí giao hàng', 'warning');
    };
    window.hideSettings = function () {};
    window.saveSettings = function () {
      window.Drv.toast('Chỉ Admin mới cấu hình được phí giao hàng', 'warning');
    };

    /* ═══════════════════════════════════════════════════════════════════
     * Panel giao hàng nội tuyến
     * ═══════════════════════════════════════════════════════════════════ */
    function buildPanel(detail) {
      var items = detail.items || [];
      var events = detail.events || [];

      var itemsHtml = '<div class="ds-section__title">Số lượng giao</div>' +
        (items.length
          ? '<div class="ds-dl-list">' + items.map(function (it) {
              return '<div class="ds-dl-item">' +
                '<div class="ds-dl-item__body">' +
                  '<div class="ds-dl-item__name">' + esc(it.product_name || '—') +
                    (it.is_reward ? ' <span class="ds-badge ds-badge--brand">THƯỞNG</span>' : '') + '</div>' +
                  '<div class="ds-dl-item__expected">Cần giao: ' +
                    window.Drv.num(it.expected_quantity) + '</div>' +
                '</div>' +
                '<input class="ds-dl-item__qty" type="number" inputmode="numeric" min="0" ' +
                  'data-item-id="' + it.id + '" value="' +
                  (it.delivered_quantity > 0 ? it.delivered_quantity : it.expected_quantity) + '">' +
              '</div>';
            }).join('') + '</div>'
          : '<div class="ds-muted" style="font-size:var(--ds-f-sm)">Không có chi tiết sản phẩm</div>');

      var historyHtml = events.length
        ? '<div class="ds-section__title">Lịch sử</div>' +
          '<div class="ds-dl-list">' + events.slice(0, 5).map(function (e) {
            return '<div class="ds-history">' +
              '<span>' + esc(eventLabel(e.event_type)) +
                (e.to_status ? ' → ' + esc(statusLabel(e.to_status)) : '') + '</span>' +
              '<span>' + esc(e.actor_username || '') + '</span>' +
            '</div>';
          }).join('') + '</div>'
        : '';

      return itemsHtml +
        '<div class="ds-kegs ds-mt-3">' +
          '<div class="ds-field">' +
            '<label class="ds-label" for="dl-keg-deliver">📦 Vỏ giao đi</label>' +
            '<input class="ds-input" id="dl-keg-deliver" type="number" inputmode="numeric" min="0" value="' +
              (detail.sale_deliver_kegs || 0) + '">' +
          '</div>' +
          '<div class="ds-field">' +
            '<label class="ds-label" for="dl-kegs">🔄 Vỏ thu về</label>' +
            '<input class="ds-input" id="dl-kegs" type="number" inputmode="numeric" min="0" value="' +
              (detail.collected_kegs || detail.sale_return_kegs || 0) + '">' +
          '</div>' +
        '</div>' +
        '<div class="ds-keg-note">Tồn vỏ khách hiện có: <strong>' +
          window.Drv.num(detail.customer_keg_balance || 0) + '</strong> vỏ' +
          (detail.sale_deliver_kegs
            ? ' · Đơn này giao đi <strong>' + window.Drv.num(detail.sale_deliver_kegs) + '</strong> vỏ'
            : '') +
        '</div>' +
        '<div class="ds-field ds-mt-3">' +
          '<label class="ds-label" for="dl-note">Ghi chú / lý do thất bại</label>' +
          '<input class="ds-input" id="dl-note" type="text" placeholder="Không bắt buộc" value="' +
            esc(detail.note || '') + '">' +
        '</div>' +
        '<div class="ds-disc">' +
          '<div class="ds-field"><label class="ds-label">Thiếu (lít)</label>' +
            '<input class="ds-input" data-disc="missing" type="number" inputmode="numeric" min="0" value="0"></div>' +
          '<div class="ds-field"><label class="ds-label">Thừa (lít)</label>' +
            '<input class="ds-input" data-disc="excess" type="number" inputmode="numeric" min="0" value="0"></div>' +
          '<div class="ds-field"><label class="ds-label">Hư hỏng (lít)</label>' +
            '<input class="ds-input" data-disc="damaged" type="number" inputmode="numeric" min="0" value="0"></div>' +
          '<button class="ds-btn ds-btn--danger ds-btn--sm" data-act="save-disc" type="button">Lưu sai lệch</button>' +
        '</div>' +
        '<div class="ds-btn-row ds-mt-3">' +
          '<button class="ds-btn ds-btn--ghost" data-act="start" type="button">Bắt đầu giao</button>' +
          '<button class="ds-btn ds-btn--success" data-act="confirm" type="button">Xác nhận giao</button>' +
        '</div>' +
        '<div class="ds-btn-row ds-mt-2">' +
          '<button class="ds-btn ds-btn--warn" data-act="fail" type="button">Giao thất bại</button>' +
          '<button class="ds-btn ds-btn--danger" data-act="disc" type="button">Có sai lệch</button>' +
        '</div>' +
        historyHtml;
    }

    function bindPanel(panel, deliveryId, card, saleId) {
      // panel là element CỐ ĐỊNH của card (chỉ innerHTML bị xoá khi đóng).
      // → Mỗi lần mở lại sẽ chồng thêm listener 'click', khiến bấm
      //   "Xác nhận giao" gửi API nhiều lần. Dùng AbortController để
      //   gỡ listener cũ trước khi gắn listener mới.
      if (panel.__abort) {
        try { panel.__abort.abort(); } catch (_) {}
      }
      var abort = new AbortController();
      panel.__abort = abort;

      // KHÔNG query element ở đây: innerHTML của panel bị xoá khi đóng →
      // các node đã bị huỷ. Phải query lại bên trong handler.
      function closePanel() {
        panel.classList.remove('is-open');
        panel.innerHTML = '';
        card.classList.remove('is-open');
      }

      panel.addEventListener('click', async function (e) {
        // Mọi click bên trong panel đều KHÔNG được bubble lên #list,
        // nếu không click vào ô nhập sẽ làm panel đóng lại.
        e.stopPropagation();
        var btn = e.target.closest('[data-act]');
        if (!btn) return;
        var act = btn.getAttribute('data-act');
        btn.disabled = true;

        // Query lại element: innerHTML của panel đã bị xoá khi đóng.
        var kegsEl = panel.querySelector('#dl-kegs');
        var kegDeliverEl = panel.querySelector('#dl-keg-deliver');
        var noteEl = panel.querySelector('#dl-note');
        var discBox = panel.querySelector('.ds-disc');

        try {
          if (act === 'disc') {
            if (discBox) discBox.classList.add('is-open');
            return;
          }

          if (act === 'start') {
            await window.Drv.api.patch('/api/driver/deliveries/' + deliveryId + '/status', { status: 'IN_PROGRESS' });
            window.Drv.toast('Đã bắt đầu giao', 'success');
            closePanel();
            await reloadDeliveries();
            return;
          }

          if (act === 'confirm') {
            var payloadItems = [];
            panel.querySelectorAll('[data-item-id]').forEach(function (el) {
              payloadItems.push({
                itemId: parseInt(el.getAttribute('data-item-id')),
                deliveredQuantity: parseFloat(el.value) || 0
              });
            });
            var deliverKegs = kegDeliverEl ? (parseInt(kegDeliverEl.value) || 0) : 0;
            var returnedKegs = kegsEl ? (parseInt(kegsEl.value) || 0) : 0;

            // Đồng bộ vỏ giao đi / vỏ thu về với đơn bán (màn Bán hàng) qua
            // cùng nghiệp vụ modal giao/thu vỏ → tồn vỏ khách + keg_stats
            // luôn khớp giữa 2 màn.
            if (saleId) {
              try {
                await window.Drv.api.post('/api/driver/sales/' + saleId + '/kegs', {
                  deliver: deliverKegs,
                  returned: returnedKegs
                });
              } catch (kegErr) {
                window.Drv.toast('Cảnh báo: cập nhật vỏ không thành công — ' + kegErr.message, 'error');
              }
            }

            var r = await window.Drv.api.post('/api/driver/deliveries/' + deliveryId + '/confirm', {
              items: payloadItems,
              collectedKegs: returnedKegs,
              note: noteEl ? noteEl.value.trim() : ''
            });
            var sm = r.summary || {};
            if (sm.totalMissing > 0 || sm.totalExcess > 0 || sm.totalDamaged > 0) {
              window.Drv.toast('Đã ghi nhận — có sai lệch, chờ xử lý', 'warning');
            } else {
              window.Drv.toast('Giao hàng thành công', 'success');
            }
            closePanel();
            await reloadDeliveries();

            // MỞ HÓA ĐƠN của đơn vừa giao — giống hệt bấm nút "👁 Xem"
            // ở tab ĐƠN GẦN ĐÂY (trang Bán hàng).
            if (saleId) {
              openInvoiceForSale(saleId);
            }
            return;
          }

          if (act === 'fail') {
            if (!noteEl) return;
            var reason = noteEl.value.trim();
            if (!reason) {
              window.Drv.toast('Vui lòng nhập lý do thất bại ở ô ghi chú', 'warning');
              noteEl.focus();
              return;
            }
            await window.Drv.api.patch('/api/driver/deliveries/' + deliveryId + '/status', {
              status: 'FAILED', failureReason: reason, note: reason
            });
            window.Drv.toast('Đã ghi nhận giao thất bại', 'warning');
            closePanel();
            await reloadDeliveries();
            return;
          }

          if (act === 'save-disc') {
            var dMissing = panel.querySelector('[data-disc="missing"]');
            var dExcess = panel.querySelector('[data-disc="excess"]');
            var dDamaged = panel.querySelector('[data-disc="damaged"]');
            if (!dMissing || !dExcess || !dDamaged) return;
            await window.Drv.api.post('/api/driver/deliveries/' + deliveryId + '/discrepancy', {
              missingLiters: parseFloat(dMissing.value) || 0,
              excessLiters: parseFloat(dExcess.value) || 0,
              damagedLiters: parseFloat(dDamaged.value) || 0,
              note: noteEl ? noteEl.value.trim() : ''
            });
            window.Drv.toast('Đã ghi nhận sai lệch', 'warning');
            closePanel();
            await reloadDeliveries();
            return;
          }
        } catch (err) {
          window.Drv.toast(err.message || 'Lỗi thao tác giao hàng', 'error');
        } finally {
          btn.disabled = false;
        }
      }, { signal: abort.signal });
    }

    async function toggleDeliveryDetail(c, card) {
      var panel = card.querySelector('.ds-delivery__panel');
      if (!panel) return;

      // Đang mở → đóng lại
      if (panel.classList.contains('is-open')) {
        panel.classList.remove('is-open');
        panel.innerHTML = '';
        card.classList.remove('is-open');
        return;
      }
      // Đang tải → bỏ qua
      if (panel.classList.contains('is-loading')) return;

      panel.classList.add('is-loading');
      panel.innerHTML = '<div class="ds-loading">Đang tải…</div>';

      var deliveryId, detail;
      try {
        var res = await window.Drv.api.post('/api/driver/deliveries', { saleId: c.sale_id });
        deliveryId = res.delivery && res.delivery.id;
        detail = await window.Drv.api.get('/api/driver/deliveries/' + deliveryId);
      } catch (err) {
        panel.classList.remove('is-loading');
        panel.innerHTML = '';
        window.Drv.toast(err.message || 'Lỗi tải đơn giao', 'error');
        return;
      }

      panel.classList.remove('is-loading');
      panel.classList.add('is-open');
      card.classList.add('is-open');
      panel.innerHTML = buildPanel(detail);
      bindPanel(panel, deliveryId, card, detail.sale_id || c.sale_id);

      // Cuộn ô "Vỏ thu về" vào giữa khung nhìn khi mở panel.
      try {
        setTimeout(function () {
          var kegEl = panel.querySelector('#dl-kegs');
          if (!kegEl) return;
          var navEl = document.querySelector('.ds-nav');
          var navH = navEl ? navEl.getBoundingClientRect().height : 0;
          var headerEl = document.querySelector('.ds-appbar');
          var headH = headerEl ? headerEl.getBoundingClientRect().height : 0;
          var top = kegEl.getBoundingClientRect().top + window.pageYOffset - headH - 12;
          var bottom = top + kegEl.getBoundingClientRect().height + navH + 12;
          var vTop = window.pageYOffset + headH;
          var vBottom = window.pageYOffset + window.innerHeight - navH;
          if (top < vTop || bottom > vBottom) {
            window.scrollTo({
              top: top - (window.innerHeight - navH - kegEl.getBoundingClientRect().height) / 2,
              behavior: 'smooth'
            });
          }
        }, 120);
      } catch (_) {}
    }

    /* ═══════════════════════════════════════════════════════════════════
     * Đồng bộ real-time với trang Bán hàng
     * ═══════════════════════════════════════════════════════════════════ */
    async function reloadDeliveries() {
      try {
        var fresh = await window.Drv.api.get('/api/driver/delivery/page-data');
        customers = (fresh && fresh.customers) || [];
        if (fresh && fresh.statusLabels) {
          STATUS_LABELS = fresh.statusLabels;
        }
        if (fresh && fresh.settings) {
          settings = fresh.settings;
          if (settings.distributor_lat) lat = settings.distributor_lat;
          if (settings.distributor_lng) lng = settings.distributor_lng;
        }
        render();
        if (map) {
          if (window.__drvMarkers) {
            window.__drvMarkers.forEach(function (m) { map.removeLayer(m); });
            window.__drvMarkers = [];
          }
          window.__drvMarkers = [];
          customers.forEach(function (c) {
            if (c.lat && c.lng) {
              var mk = L.marker([parseFloat(c.lat), parseFloat(c.lng)], { icon: icon('#3b82f6', 10) })
                .addTo(map).bindPopup(esc(c.name));
              window.__drvMarkers.push(mk);
            }
          });
        }
      } catch (e) {
        console.error('[DELIVERY] reload error:', e);
      }
    }

    /* ═══════════════════════════════════════════════════════════════════
     * Boot
     * ═══════════════════════════════════════════════════════════════════ */
    S.mount({
      key: 'delivery',
      icon: '🚚',
      title: 'Giao hàng',
      content: markup()
    });

    initMap();
    render();

    // Tên tài xế trên app bar
    window.Drv.setupHeader();

    if (window.DrvSync && typeof window.DrvSync.onChange === 'function') {
      window.DrvSync.onChange(function (reason) {
        if (reason === 'focus' || reason === 'visibility') return;
        reloadDeliveries();
      });
    }

    document.getElementById('list').addEventListener('click', function (e) {
      if (e.target.closest('a')) return;
      if (e.target.closest('.ds-btn--dir.is-disabled')) return;
      // Click bên trong panel giao hàng → không đóng panel, không chuyển đơn.
      if (e.target.closest('.ds-delivery__panel')) return;
      var card = e.target.closest('[data-customer-id]');
      if (!card) return;
      var cid = parseInt(card.getAttribute('data-customer-id'));
      var c = customers.find(function (x) { return x.id === cid; });
      if (!c) return;

      // Nút "Giao hàng" → mở/đóng panel, không xử lý bấm card
      var delivBtn = e.target.closest('[data-act="open-delivery"]');
      if (delivBtn) {
        e.stopPropagation();
        delivBtn.classList.add('is-busy');
        toggleDeliveryDetail(c, card).finally(function () {
          delivBtn.classList.remove('is-busy');
        });
        return;
      }

      toggleDeliveryDetail(c, card);
    });
  })();
  </script>
</body>
